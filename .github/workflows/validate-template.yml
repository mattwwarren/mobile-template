name: Validate Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  schedule:
    # Weekly drift check (Monday 06:00 UTC) — catches Expo SDK
    # compatibility drift that only surfaces between PRs.
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: validate (${{ matrix.config.name }})
    strategy:
      matrix:
        config:
          - name: default
            args: '--data project_name="Test App" --data project_slug=test-app'
            bundle_id: com.example.testapp
          - name: auth-enabled
            args: '--data project_name="Auth App" --data project_slug=auth-app --data auth_enabled=true --data auth_provider=mock'
            bundle_id: com.example.authapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install copier
      - name: Templatize
        run: bash scripts/templatize.sh
      - name: Verify templatize.sh jinja output
        run: |
          grep -F '"bundleIdentifier": "{{ bundle_id }}"' .templatized/app.json.jinja
          grep -F '"package": "{{ bundle_id }}"' .templatized/app.json.jinja
      - name: Generate project (${{ matrix.config.name }})
        run: |
          copier copy .templatized /tmp/test-project --trust --defaults ${{ matrix.config.args }} --data bundle_id=${{ matrix.config.bundle_id }}
      - name: Verify bundle id substitution
        run: |
          grep -F '"bundleIdentifier": "${{ matrix.config.bundle_id }}"' /tmp/test-project/app.json
          grep -F '"package": "${{ matrix.config.bundle_id }}"' /tmp/test-project/app.json
      - name: Install dependencies
        working-directory: /tmp/test-project
        run: npm install
      - name: Check Expo dependency alignment
        working-directory: /tmp/test-project
        run: npx expo install --check
      - name: Lint
        working-directory: /tmp/test-project
        run: npx biome check .
      - name: Typecheck
        working-directory: /tmp/test-project
        run: npx tsc --noEmit
      - name: Test
        working-directory: /tmp/test-project
        run: npm test
