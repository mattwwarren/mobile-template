name: Validate Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  schedule:
    # Weekly drift check (Monday 06:00 UTC) — catches Expo SDK
    # compatibility drift that only surfaces between PRs.
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: default
            args: '--data project_name="Test App" --data project_slug=test-app'
            bundle_id: com.example.testapp
            eas_enabled: 'true'
          - name: auth-enabled
            args: '--data project_name="Auth App" --data project_slug=auth-app --data auth_enabled=true --data auth_provider=mock'
            bundle_id: com.example.authapp
            eas_enabled: 'true'
          - name: eas-disabled
            args: '--data project_name="No EAS App" --data project_slug=no-eas-app --data enable_eas=false'
            bundle_id: com.example.noeasapp
            eas_enabled: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install copier
      - name: Templatize
        run: bash scripts/templatize.sh
      - name: Verify templatize.sh jinja output
        run: |
          grep -F '"bundleIdentifier": "{{ bundle_id }}"' .templatized/app.json.jinja
          grep -F '"package": "{{ bundle_id }}"' .templatized/app.json.jinja
      - name: Generate project (${{ matrix.config.name }})
        run: |
          copier copy .templatized /tmp/test-project --trust --defaults ${{ matrix.config.args }} --data bundle_id=${{ matrix.config.bundle_id }}
      - name: Verify bundle id substitution
        run: |
          grep -F '"bundleIdentifier": "${{ matrix.config.bundle_id }}"' /tmp/test-project/app.json
          grep -F '"package": "${{ matrix.config.bundle_id }}"' /tmp/test-project/app.json
      - name: Verify EAS config present
        if: matrix.config.eas_enabled == 'true'
        run: |
          test -f /tmp/test-project/eas.json
          node -e "const c=require('/tmp/test-project/eas.json'); const p=Object.keys(c.build).sort(); if(JSON.stringify(p)!==JSON.stringify(['development','preview','production'])) process.exit(1); if(new Set(Object.values(c.build).map(x=>x.channel)).size!==3) process.exit(1);"
          EAS_UPDATES_PACKAGE="$(node -p "const app=require('./app.json'); app.expo.plugins.find((plugin) => typeof plugin === 'string' && plugin.endsWith('-updates'))")"
          EAS_UPDATES_VERSION="$(node -p "require('./package.json').dependencies[process.argv[1]]" "$EAS_UPDATES_PACKAGE")"
          node -e "const sourcePackage=require('./package.json'); const sourceApp=require('./app.json'); const generatedPackage=require('/tmp/test-project/package.json'); const generatedApp=require('/tmp/test-project/app.json'); const name=process.argv[1]; const version=process.argv[2]; if (!sourceApp.expo.plugins.includes(name) || sourcePackage.dependencies[name] !== version || generatedApp.expo.plugins.indexOf(name) === -1 || generatedPackage.dependencies[name] !== version) process.exit(1)" "$EAS_UPDATES_PACKAGE" "$EAS_UPDATES_VERSION"
          grep -F "\"$EAS_UPDATES_PACKAGE\"" /tmp/test-project/package.json
          grep -F "\"$EAS_UPDATES_PACKAGE\"" /tmp/test-project/app.json
          grep -F '"runtimeVersion"' /tmp/test-project/app.json
      - name: Verify EAS config absent
        if: matrix.config.eas_enabled == 'false'
        run: |
          EAS_UPDATES_PACKAGE="$(node -p "const app=require('./app.json'); app.expo.plugins.find((plugin) => typeof plugin === 'string' && plugin.endsWith('-updates'))")"
          if [ -f /tmp/test-project/eas.json ]; then echo "eas.json should not exist"; exit 1; fi
          if grep -q "$EAS_UPDATES_PACKAGE" /tmp/test-project/package.json; then echo "EAS updates dependency should be absent"; exit 1; fi
          if grep -q "$EAS_UPDATES_PACKAGE" /tmp/test-project/app.json; then echo "EAS updates plugin should be absent"; exit 1; fi
          if grep -q "runtimeVersion" /tmp/test-project/app.json; then echo "runtimeVersion should be absent"; exit 1; fi
      - name: Install dependencies
        working-directory: /tmp/test-project
        run: npm install
      - name: Check Expo dependency alignment
        working-directory: /tmp/test-project
        run: npx expo install --check
      - name: Lint
        working-directory: /tmp/test-project
        run: npx biome check .
      - name: Typecheck
        working-directory: /tmp/test-project
        run: npx tsc --noEmit
      - name: Test
        working-directory: /tmp/test-project
        run: npm test
